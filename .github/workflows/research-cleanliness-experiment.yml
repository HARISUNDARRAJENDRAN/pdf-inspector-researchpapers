name: Research parser cleanliness experiment

on:
  workflow_dispatch:
  push:
    branches: [opt/research-cleanliness]
    paths: ['.github/workflows/research-cleanliness-experiment.yml']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RAYON_NUM_THREADS: '2'
  MALLOC_ARENA_MAX: '2'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmarks/research_fidelity/requirements.txt

      - name: Install audit dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc time
          python -m pip install --upgrade pip
          python -m pip install -r benchmarks/research_fidelity/requirements.txt

      - name: Prepare baseline and candidate
        run: |
          set -euo pipefail
          git fetch origin main lab/research-fidelity-audit
          BASE_SHA=$(git rev-parse origin/main)
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/pdf-baseline "$BASE_SHA"
          git worktree add --detach /tmp/pdf-candidate "$BASE_SHA"
          git show origin/lab/research-fidelity-audit:benchmarks/research_fidelity/compare_candidate.py > /tmp/compare_candidate.py
          mkdir -p "$RUNNER_TEMP/cleanliness-experiment/report"

      - name: Apply allocation-conscious semantic cleanup
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          preprocess = Path('/tmp/pdf-candidate/src/markdown/preprocess.rs')
          source = preprocess.read_text()
          source = source.replace(
              'use crate::types::{TextItem, TextLine};\n',
              'use crate::types::{ItemType, TextItem, TextLine};\n',
              1,
          )
          anchor = 'use super::analysis::detect_header_level;\n'
          implementation = r'''use super::analysis::detect_header_level;

#[derive(Debug, Hash, PartialEq, Eq)]
struct ExactOverlayKey<'a> {
    text: &'a str,
    font: &'a str,
    x: i32,
    y: i32,
    width: i32,
    height: i32,
    font_size: i32,
    page: u32,
    is_bold: bool,
    is_italic: bool,
    is_underline: bool,
    is_strikeout: bool,
    mcid: Option<i64>,
}

fn quantized(value: f32, scale: f32) -> i32 {
    if value.is_finite() {
        (value * scale).round() as i32
    } else {
        0
    }
}

fn overlay_key(item: &TextItem) -> ExactOverlayKey<'_> {
    ExactOverlayKey {
        text: item.text.as_str(),
        font: item.font.as_str(),
        x: quantized(item.x, 100.0),
        y: quantized(item.y, 100.0),
        width: quantized(item.width, 100.0),
        height: quantized(item.height, 100.0),
        font_size: quantized(item.font_size, 100.0),
        page: item.page,
        is_bold: item.is_bold,
        is_italic: item.is_italic,
        is_underline: item.is_underline,
        is_strikeout: item.is_strikeout,
        mcid: item.mcid,
    }
}

fn adjacent_overlay_candidate(left: &TextItem, right: &TextItem) -> bool {
    matches!((&left.item_type, &right.item_type), (ItemType::Text, ItemType::Text))
        && left.text == right.text
        && (left.x - right.x).abs() <= 0.02
        && (left.y - right.y).abs() <= 0.02
}

/// Remove duplicate paint operations only from the semantic Markdown stream.
///
/// Some PDF producers draw the same glyph run twice at the same coordinates to
/// simulate a heavier face. Humans see one word; a text parser otherwise emits
/// it twice. The raw positioned-text API remains untouched. Ordinary lines pay
/// only an adjacent-window scan; the borrowed-key set is allocated solely when
/// duplicate geometry is actually present.
pub(crate) fn remove_exact_duplicate_overlays(mut lines: Vec<TextLine>) -> Vec<TextLine> {
    for line in &mut lines {
        if line.items.len() < 2
            || !line
                .items
                .windows(2)
                .any(|pair| adjacent_overlay_candidate(&pair[0], &pair[1]))
        {
            continue;
        }

        let mut keep = Vec::with_capacity(line.items.len());
        {
            let mut seen = HashSet::with_capacity(line.items.len());
            for item in &line.items {
                if !matches!(&item.item_type, ItemType::Text) {
                    keep.push(true);
                    continue;
                }
                keep.push(seen.insert(overlay_key(item)));
            }
        }

        let mut index = 0usize;
        line.items.retain(|_| {
            let retain = keep[index];
            index += 1;
            retain
        });
    }
    lines.retain(|line| !line.items.is_empty());
    lines
}

'''
          if source.count(anchor) != 1:
              raise SystemExit('preprocess anchor changed')
          source = source.replace(anchor, implementation, 1)
          source += r'''

#[cfg(test)]
mod exact_overlay_tests {
    use super::*;

    fn item(text: &str, x: f32, mcid: Option<i64>, bold: bool) -> TextItem {
        TextItem {
            text: text.to_owned(),
            x,
            y: 700.0,
            width: 32.0,
            height: 10.0,
            font: "Body".to_owned(),
            font_size: 10.0,
            page: 1,
            is_bold: bold,
            is_italic: false,
            is_underline: false,
            is_strikeout: false,
            item_type: ItemType::Text,
            mcid,
        }
    }

    fn line(items: Vec<TextItem>) -> TextLine {
        TextLine {
            items,
            y: 700.0,
            page: 1,
            adaptive_threshold: 0.1,
        }
    }

    #[test]
    fn removes_only_exact_duplicate_paint_operation() {
        let duplicate = item("HELLO", 72.0, None, false);
        let lines = remove_exact_duplicate_overlays(vec![line(vec![
            duplicate.clone(),
            duplicate,
            item("HELLO", 172.0, None, false),
        ])]);
        assert_eq!(lines[0].items.len(), 2);
        assert_eq!(lines[0].items[0].x, 72.0);
        assert_eq!(lines[0].items[1].x, 172.0);
    }

    #[test]
    fn preserves_distinct_structure_and_style() {
        let lines = remove_exact_duplicate_overlays(vec![line(vec![
            item("Label", 72.0, Some(1), false),
            item("Label", 72.0, Some(2), false),
            item("Label", 72.0, Some(1), true),
        ])]);
        assert_eq!(lines[0].items.len(), 3);
    }
}
