name: Research fidelity experiment

on:
  push:
    branches:
      - opt/research-paper-fidelity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RAYON_NUM_THREADS: "2"
      MALLOC_ARENA_MAX: "2"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Prepare untouched baseline and patched candidate
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/pdf-base origin/main
          git worktree add --detach /tmp/pdf-candidate "$GITHUB_SHA"
          python3 benchmarks/research_spacing_experiment.py patch /tmp/pdf-candidate/src/extractor/content_stream.rs
          python3 benchmarks/research_hotpath_experiment.py patch /tmp/pdf-candidate/src/extractor/content_stream.rs
          python3 benchmarks/research_table_experiment.py patch /tmp/pdf-candidate/src/tables/grid.rs
          python3 benchmarks/research_layout_experiment.py patch /tmp/pdf-candidate/src/extractor/layout.rs
          python3 benchmarks/research_math_experiment.py patch /tmp/pdf-candidate/src/markdown/analysis.rs
          cd /tmp/pdf-candidate
          cargo fmt --all

      - name: Add paired speed driver
        run: |
          set -euo pipefail
          cp benchmarks/research_speed.rs /tmp/pdf-base/src/bin/research_speed.rs
          cp benchmarks/research_speed.rs /tmp/pdf-candidate/src/bin/research_speed.rs
          cat benchmarks/research_speed_cargo.toml >> /tmp/pdf-base/Cargo.toml
          cat benchmarks/research_speed_cargo.toml >> /tmp/pdf-candidate/Cargo.toml

      - name: Generate fidelity fixtures
        run: |
          set -euo pipefail
          python3 benchmarks/research_spacing_experiment.py fixture /tmp/style-spacing.pdf
          python3 benchmarks/research_table_experiment.py fixture /tmp/academic-table.pdf
          python3 benchmarks/research_layout_experiment.py fixture /tmp/sidebar-layout.pdf
          python3 benchmarks/research_math_experiment.py fixture /tmp/display-math.pdf

      - name: Build baseline and candidate release binaries
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=/tmp/target-base cargo build --release --manifest-path /tmp/pdf-base/Cargo.toml --bin pdf2md --bin research-speed
          CARGO_TARGET_DIR=/tmp/target-candidate cargo build --release --manifest-path /tmp/pdf-candidate/Cargo.toml --bin pdf2md --bin research-speed

      - name: Verify spacing fidelity
        run: |
          set -euo pipefail
          /tmp/target-base/release/pdf2md /tmp/style-spacing.pdf > /tmp/base-spacing.md
          /tmp/target-candidate/release/pdf2md /tmp/style-spacing.pdf > /tmp/candidate-spacing.md
          python3 benchmarks/research_spacing_experiment.py score /tmp/base-spacing.md /tmp/candidate-spacing.md

      - name: Verify academic table fidelity
        run: |
          set -euo pipefail
          /tmp/target-base/release/pdf2md /tmp/academic-table.pdf > /tmp/base-table.md
          /tmp/target-candidate/release/pdf2md /tmp/academic-table.pdf > /tmp/candidate-table.md
          grep -F '|Predictive|Edge|Adaptive|CSI|Main Limitation|' /tmp/candidate-table.md
          grep -F '|x|yes|yes|x|Limited-awareness|' /tmp/candidate-table.md
          if grep -Fq '|Predictive|Edge|Adaptive|CSI|Main Limitation|' /tmp/base-table.md; then
            echo 'baseline unexpectedly preserved the narrow CSI/final-column boundary' >&2
            exit 1
          fi

      - name: Verify title and sidebar reading order
        run: |
          set -euo pipefail
          /tmp/target-base/release/pdf2md /tmp/sidebar-layout.pdf > /tmp/base-layout.md
          /tmp/target-candidate/release/pdf2md /tmp/sidebar-layout.pdf > /tmp/candidate-layout.md
          python3 - <<'PY'
          from pathlib import Path
          base = Path('/tmp/base-layout.md').read_text()
          candidate = Path('/tmp/candidate-layout.md').read_text()
          for part in [
              'Sentient Networks: A Predictive Edge Intelligence Framework',
              'for Autonomous Wi-Fi Stability Prediction and',
              'Self-Optimization',
          ]:
              if part not in candidate:
                  raise SystemExit(f'candidate lost title fragment: {part}')
          intro = candidate.find('1. Introduction')
          sidebar = candidate.find('Received: August 2026')
          if intro < 0 or sidebar < 0 or intro > sidebar:
              raise SystemExit('candidate did not read primary article before left sidebar')
          base_intro = base.find('1. Introduction')
          base_sidebar = base.find('Received: August 2026')
          print(f'LAYOUT baseline intro={base_intro} sidebar={base_sidebar}')
          print(f'LAYOUT candidate intro={intro} sidebar={sidebar}')
          PY

      - name: Verify display math is not promoted to headings
        run: |
          set -euo pipefail
          /tmp/target-base/release/pdf2md /tmp/display-math.pdf > /tmp/base-math.md
          /tmp/target-candidate/release/pdf2md /tmp/display-math.pdf > /tmp/candidate-math.md
          python3 - <<'PY'
          from pathlib import Path
          candidate = Path('/tmp/candidate-math.md').read_text()
          expressions = ['X = {x1, x2, ..., xN}', '0 <= p_t <= 1', 'f_t = [sigma_t^2, mu_t, rho_t, RSSI_t]']
          for expression in expressions:
              matches = [line for line in candidate.splitlines() if expression in line]
              if not matches:
                  raise SystemExit(f'candidate lost display expression: {expression}')
              if any(line.lstrip().startswith('#') for line in matches):
                  raise SystemExit(f'display equation became heading: {matches}')
          print('MATH display expressions preserved without heading markers')
          PY

      - name: Download pinned arXiv latency corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/corpus
          for id in 1706.03762v7 1810.04805v2 2005.14165v4 2010.11929v2 2006.11239v2; do
            curl --fail --location --retry 4 --retry-delay 2 --user-agent 'Learnspace research parser benchmark/1.0' "https://arxiv.org/pdf/$id" -o "/tmp/corpus/$id.pdf" || curl --fail --location --retry 4 --retry-delay 2 --user-agent 'Learnspace research parser benchmark/1.0' "https://export.arxiv.org/pdf/$id" -o "/tmp/corpus/$id.pdf"
            test -s "/tmp/corpus/$id.pdf"
          done

      - name: Verify research fast-path speed is maintained
        run: python3 benchmarks/research_spacing_experiment.py speed /tmp/target-base/release/research-speed /tmp/target-candidate/release/research-speed /tmp/corpus/*.pdf

      - name: Remove benchmark-only driver before production validation
        run: |
          set -euo pipefail
          rm -f /tmp/pdf-candidate/src/bin/research_speed.rs
          git -C /tmp/pdf-candidate restore Cargo.toml

      - name: Validate production formatting
        run: |
          set -euo pipefail
          cd /tmp/pdf-candidate
          cargo fmt --all -- --check

      - name: Validate production clippy
        run: |
          set -euo pipefail
          cd /tmp/pdf-candidate
          cargo clippy -- -D warnings

      - name: Validate production tests
        id: production_tests
        continue-on-error: true
        run: |
          set -o pipefail
          cd /tmp/pdf-candidate
          cargo test --verbose 2>&1 | tee /tmp/production-tests.log

      - name: Upload production test log
        if: steps.production_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-test-log
          path: /tmp/production-tests.log
          retention-days: 1

      - name: Gate production tests
        if: steps.production_tests.outcome == 'failure'
        run: exit 1

      - name: Validate root WebAssembly target
        run: |
          set -euo pipefail
          cd /tmp/pdf-candidate
          cargo check --target wasm32-unknown-unknown

      - name: Validate browser WebAssembly crate
        run: |
          set -euo pipefail
          cd /tmp/pdf-candidate
          cargo check --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown

      - name: Validate production diff
        run: |
          set -euo pipefail
          cd /tmp/pdf-candidate
          git diff --check

      - name: Publish clean validated release branch
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --detach origin/main
          cp /tmp/pdf-candidate/src/extractor/content_stream.rs src/extractor/content_stream.rs
          cp /tmp/pdf-candidate/src/tables/grid.rs src/tables/grid.rs
          cp /tmp/pdf-candidate/src/extractor/layout.rs src/extractor/layout.rs
          cp /tmp/pdf-candidate/src/markdown/analysis.rs src/markdown/analysis.rs
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/extractor/content_stream.rs src/tables/grid.rs src/extractor/layout.rs src/markdown/analysis.rs
          git commit -m 'perf: improve research paper fidelity without latency regression'
          git push --force origin HEAD:refs/heads/release/research-paper-fidelity
