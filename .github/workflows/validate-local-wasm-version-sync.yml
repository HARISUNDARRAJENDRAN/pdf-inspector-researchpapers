name: Validate local WASM version sync fix

on:
  push:
    branches: [fix/local-wasm-version-sync]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check package version sync
        run: python3 scripts/version.py --check
      - name: Run version script tests
        run: python3 -m unittest scripts.tests.test_version
      - name: Run full developer script tests
        run: python3 -m unittest discover -s scripts/tests
      - name: Run Rust tests
        run: cargo test --verbose
