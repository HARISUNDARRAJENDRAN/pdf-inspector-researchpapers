name: Research fidelity candidate latency gate

on:
  push:
    branches: [lab/research-fidelity-audit]
    paths:
      - '.github/workflows/research-candidate-latency.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RAYON_NUM_THREADS: '2'
  MALLOC_ARENA_MAX: '2'

jobs:
  paired-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare baseline and candidate worktrees
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/pdf-base origin/main
          git worktree add --detach /tmp/pdf-candidate "$GITHUB_SHA"

      - name: Add identical benchmark drivers
        run: |
          set -euo pipefail
          for root in /tmp/pdf-base /tmp/pdf-candidate; do
            cat > "$root/src/bin/research_latency.rs" <<'RS'
          use pdf_inspector::process_research_pdf;
          use std::env;
          use std::time::Instant;

          const FNV_OFFSET: u64 = 0xcbf29ce484222325;
          const FNV_PRIME: u64 = 0x100000001b3;

          fn update_hash(mut hash: u64, bytes: &[u8]) -> u64 {
              for &byte in bytes {
                  hash ^= u64::from(byte);
                  hash = hash.wrapping_mul(FNV_PRIME);
              }
              hash
          }

          fn main() {
              let paths: Vec<String> = env::args().skip(1).collect();
              assert!(!paths.is_empty());
              let started = Instant::now();
              let mut digest = FNV_OFFSET;
              let mut markdown_bytes = 0usize;
              for path in &paths {
                  let result = process_research_pdf(path)
                      .unwrap_or_else(|error| panic!("failed to parse {path}: {error}"));
                  let markdown = result.markdown.expect("research paper produced no markdown");
                  markdown_bytes += markdown.len();
                  digest = update_hash(digest, markdown.as_bytes());
              }
              println!(
                  "{} {} {} {}",
                  started.elapsed().as_nanos(),
                  digest,
                  markdown_bytes,
                  paths.len()
              );
          }
          RS
            cat >> "$root/Cargo.toml" <<'TOML'

          [[bin]]
          name = "research-latency"
          path = "src/bin/research_latency.rs"
          TOML
          done

      - name: Download pinned native-text research corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/research-corpus
          for id in 1706.03762v7 1810.04805v2 2005.14165v4 2010.11929v2 2006.11239v2; do
            out="/tmp/research-corpus/${id}.pdf"
            curl --fail --location --retry 4 --retry-delay 2 \
              --user-agent 'Learnspace research parser benchmark/1.0' \
              "https://arxiv.org/pdf/${id}" --output "$out" || \
            curl --fail --location --retry 4 --retry-delay 2 \
              --user-agent 'Learnspace research parser benchmark/1.0' \
              "https://export.arxiv.org/pdf/${id}" --output "$out"
            test -s "$out"
          done

      - name: Build release binaries
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=/tmp/target-base cargo build --release \
            --manifest-path /tmp/pdf-base/Cargo.toml --bin research-latency
          CARGO_TARGET_DIR=/tmp/target-candidate cargo build --release \
            --manifest-path /tmp/pdf-candidate/Cargo.toml --bin research-latency

      - name: Run alternating paired measurements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import statistics
          import subprocess
          from pathlib import Path

          papers = sorted(str(path) for path in Path('/tmp/research-corpus').glob('*.pdf'))
          base = '/tmp/target-base/release/research-latency'
          candidate = '/tmp/target-candidate/release/research-latency'

          def run(binary):
              completed = subprocess.run(
                  [binary, *papers],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  env=os.environ.copy(),
              )
              elapsed, digest, markdown_bytes, count = completed.stdout.strip().split()
              return int(elapsed), {
                  'digest': int(digest),
                  'markdown_bytes': int(markdown_bytes),
                  'documents': int(count),
              }

          for _ in range(3):
              run(base)
              run(candidate)

          base_samples = []
          candidate_samples = []
          base_signature = None
          candidate_signature = None

          for round_index in range(30):
              order = (base, candidate) if round_index % 2 == 0 else (candidate, base)
              for binary in order:
                  elapsed, signature = run(binary)
                  if binary == base:
                      base_samples.append(elapsed)
                      base_signature = base_signature or signature
                      if signature != base_signature:
                          raise RuntimeError('baseline output changed between rounds')
                  else:
                      candidate_samples.append(elapsed)
                      candidate_signature = candidate_signature or signature
                      if signature != candidate_signature:
                          raise RuntimeError('candidate output changed between rounds')

          base_median = statistics.median(base_samples)
          candidate_median = statistics.median(candidate_samples)
          delta = (candidate_median - base_median) / base_median * 100.0
          result = {
              'base_median_ms': base_median / 1_000_000,
              'candidate_median_ms': candidate_median / 1_000_000,
              'candidate_delta_percent': delta,
              'rounds': len(base_samples),
              'base_signature': base_signature,
              'candidate_signature': candidate_signature,
              'base_samples_ms': [value / 1_000_000 for value in base_samples],
              'candidate_samples_ms': [value / 1_000_000 for value in candidate_samples],
          }
          Path('/tmp/research-candidate-latency.json').write_text(
              json.dumps(result, indent=2) + '\n'
          )
          summary = (
              '## Paired research-parser latency gate\n\n'
              f'- Pinned papers: **{base_signature["documents"]}**\n'
              f'- Alternating rounds: **{len(base_samples)}**\n'
              f'- Current `main`: **{result["base_median_ms"]:.3f} ms**\n'
              f'- Fidelity candidate: **{result["candidate_median_ms"]:.3f} ms**\n'
              f'- Candidate delta: **{delta:+.3f}%**\n'
              f'- Output changed intentionally: **{base_signature != candidate_signature}**\n'
          )
          print(summary)
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(summary)
          if candidate_median > base_median * 1.01:
              raise RuntimeError(
                  f'candidate regressed median latency by {delta:.3f}% (limit +1.0%)'
              )
          PY

      - name: Upload paired latency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-fidelity-candidate-latency-${{ github.run_id }}
          path: /tmp/research-candidate-latency.json
          if-no-files-found: warn
          retention-days: 30
