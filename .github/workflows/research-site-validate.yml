name: Validate research-paper comparison site

on:
  push:
    branches: [feat/research-paper-site]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Rust tests
        run: cargo test --verbose
      - name: WASM check
        run: cargo check --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown
      - name: WASM clippy
        run: cargo clippy --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build browser WASM
        run: wasm-pack build wasm --target web --out-dir pkg --release
      - name: Verify research comparison page
        run: |
          test -s site/index.html
          grep -q 'processResearchPdf' wasm/pkg/pdf_inspector_wasm.js
          grep -q 'processPdf' wasm/pkg/pdf_inspector_wasm.js
          grep -q 'Firecrawl PDF Inspector' site/index.html
          grep -q 'processResearchPdf' site/index.html
          grep -q 'processPdf' site/index.html
          grep -q './wasm/pdf_inspector_wasm.js' site/index.html
          if grep -q 'github.com/firecrawl/pdf-inspector" class="github-link' site/index.html; then
            echo 'Primary GitHub link still points to upstream Firecrawl site' >&2
            exit 1
          fi
