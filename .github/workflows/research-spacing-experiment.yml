name: Research fidelity experiment

on:
  push:
    branches:
      - opt/research-paper-fidelity

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAYON_NUM_THREADS: "2"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Prepare baseline and candidate
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/pdf-base origin/main
          git worktree add --detach /tmp/pdf-candidate "$GITHUB_SHA"
          python3 benchmarks/research_spacing_experiment.py patch /tmp/pdf-candidate/src/extractor/content_stream.rs
          python3 benchmarks/research_table_experiment.py patch /tmp/pdf-candidate/src/tables/grid.rs
          cd /tmp/pdf-candidate
          cargo fmt --all

      - name: Add speed driver
        run: |
          set -euo pipefail
          cp benchmarks/research_speed.rs /tmp/pdf-base/src/bin/research_speed.rs
          cp benchmarks/research_speed.rs /tmp/pdf-candidate/src/bin/research_speed.rs
          cat benchmarks/research_speed_cargo.toml >> /tmp/pdf-base/Cargo.toml
          cat benchmarks/research_speed_cargo.toml >> /tmp/pdf-candidate/Cargo.toml

      - name: Generate fidelity fixtures
        run: |
          python3 benchmarks/research_spacing_experiment.py fixture /tmp/style-spacing.pdf
          python3 benchmarks/research_table_experiment.py fixture /tmp/academic-table.pdf

      - name: Build both implementations
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=/tmp/target-base cargo build --release --manifest-path /tmp/pdf-base/Cargo.toml --bin pdf2md --bin research-speed
          CARGO_TARGET_DIR=/tmp/target-candidate cargo build --release --manifest-path /tmp/pdf-candidate/Cargo.toml --bin pdf2md --bin research-speed

      - name: Verify spacing fidelity
        run: |
          set -euo pipefail
          /tmp/target-base/release/pdf2md /tmp/style-spacing.pdf > /tmp/base-spacing.md
          /tmp/target-candidate/release/pdf2md /tmp/style-spacing.pdf > /tmp/candidate-spacing.md
          python3 benchmarks/research_spacing_experiment.py score /tmp/base-spacing.md /tmp/candidate-spacing.md

      - name: Verify academic table fidelity
        run: |
          set -euo pipefail
          /tmp/target-base/release/pdf2md /tmp/academic-table.pdf > /tmp/base-table.md
          /tmp/target-candidate/release/pdf2md /tmp/academic-table.pdf > /tmp/candidate-table.md
          python3 benchmarks/research_table_experiment.py score /tmp/base-table.md /tmp/candidate-table.md

      - name: Download pinned arXiv corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/corpus
          for id in 1706.03762v7 1810.04805v2 2005.14165v4 2010.11929v2 2006.11239v2; do
            curl --fail --location --retry 4 --retry-delay 2 --user-agent 'Learnspace research parser benchmark/1.0' "https://arxiv.org/pdf/$id" -o "/tmp/corpus/$id.pdf" || curl --fail --location --retry 4 --retry-delay 2 --user-agent 'Learnspace research parser benchmark/1.0' "https://export.arxiv.org/pdf/$id" -o "/tmp/corpus/$id.pdf"
          done

      - name: Verify speed is maintained
        run: python3 benchmarks/research_spacing_experiment.py speed /tmp/target-base/release/research-speed /tmp/target-candidate/release/research-speed /tmp/corpus/*.pdf

      - name: Run candidate tests
        run: |
          set -euo pipefail
          cd /tmp/pdf-candidate
          cargo fmt --all -- --check
          cargo test
