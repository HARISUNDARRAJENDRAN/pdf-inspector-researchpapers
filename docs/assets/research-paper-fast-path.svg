<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Research paper fast path benchmark</title>
  <desc id="desc">A line-art benchmark visual showing the trusted research-paper fast path reducing median processing time from 606.376 milliseconds to 569.215 milliseconds while preserving byte-identical Markdown.</desc>
  <rect width="1200" height="620" rx="28" fill="#fbfbf8"/>
  <rect x="24" y="24" width="1152" height="572" rx="22" fill="none" stroke="#172033" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#172033">
    <text x="70" y="88" font-size="18" font-weight="700" letter-spacing="2">RESEARCH-PAPER FAST PATH</text>
    <text x="70" y="132" font-size="35" font-weight="800">Same Markdown. Less pre-extraction work.</text>
    <text x="70" y="163" font-size="17" fill="#4b5563">Validated on five pinned arXiv papers, 24 rotated measured rounds, after 3 excluded warm-ups.</text>
  </g>

  <!-- hand-drawn research paper doodle -->
  <g transform="translate(72 208)" fill="none" stroke="#172033" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 10 C17 9, 18 8, 21 8 L190 8 C196 8, 200 12, 200 18 L200 250 C200 256, 196 260, 190 260 L20 260 C14 260, 10 256, 10 250 L10 18 C10 13, 13 10, 18 10Z"/>
    <path d="M38 46 C76 43, 110 45, 168 45"/>
    <path d="M38 67 C78 67, 125 66, 168 68"/>
    <path d="M38 97 C68 95, 114 97, 168 96"/>
    <path d="M38 116 C80 116, 119 114, 168 116"/>
    <path d="M38 135 C71 136, 119 136, 150 135"/>
    <rect x="38" y="163" width="55" height="44" rx="4"/>
    <path d="M105 171 C128 168, 147 171, 168 170"/>
    <path d="M105 189 C129 189, 150 187, 168 189"/>
    <path d="M105 207 C129 207, 147 205, 162 207"/>
    <path d="M56 237 C88 235, 128 237, 161 236"/>
    <path d="M12 16 C8 38, 9 89, 11 122" opacity=".35"/>
  </g>

  <!-- fast arrow -->
  <g transform="translate(320 262)" fill="none" stroke="#172033" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 42 C75 37, 127 37, 203 40"/>
    <path d="M182 23 C196 29, 205 36, 217 40 C204 46, 196 53, 184 61"/>
    <path d="M34 18 C64 14, 85 15, 112 16" opacity=".45"/>
    <path d="M20 67 C58 70, 85 69, 127 67" opacity=".45"/>
  </g>

  <!-- pipeline card -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#172033">
    <rect x="530" y="212" width="580" height="214" rx="20" fill="#eef5ff" stroke="#172033" stroke-width="2"/>
    <text x="563" y="251" font-size="16" font-weight="800" letter-spacing="1.5">TRUSTED NATIVE-TEXT SOURCE</text>
    <text x="563" y="282" font-size="23" font-weight="800">arXiv / controlled repository</text>
    <g font-size="16">
      <text x="563" y="324">1. Skip classification + its document-wide font scan</text>
      <text x="563" y="354">2. Run the normal extraction + Markdown pipeline</text>
      <text x="563" y="384">3. Keep downstream text-quality / OCR signals enabled</text>
    </g>
  </g>

  <!-- benchmark bars -->
  <g transform="translate(327 453)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#172033">
    <text x="0" y="0" font-size="14" font-weight="700" letter-spacing="1">MEDIAN FOR 5 PAPERS</text>
    <text x="0" y="41" font-size="15" font-weight="700">Current main</text>
    <rect x="142" y="24" width="360" height="24" rx="12" fill="#d9dee7"/>
    <text x="520" y="42" font-size="18" font-weight="800">606.376 ms</text>

    <text x="0" y="91" font-size="15" font-weight="700">Fast path</text>
    <rect x="142" y="74" width="338" height="24" rx="12" fill="#94bdf5"/>
    <text x="498" y="92" font-size="18" font-weight="800">569.215 ms</text>

    <rect x="650" y="18" width="190" height="88" rx="16" fill="#fff" stroke="#172033" stroke-width="2"/>
    <text x="671" y="50" font-size="29" font-weight="900">6.13%</text>
    <text x="671" y="76" font-size="14" font-weight="700">faster vs main</text>
    <text x="671" y="96" font-size="12" fill="#4b5563">byte-identical output</text>
  </g>

  <!-- small hand-drawn accents -->
  <g fill="none" stroke="#172033" stroke-width="2.5" stroke-linecap="round">
    <path d="M1076 88 C1092 74, 1108 78, 1112 93 C1115 106, 1105 115, 1092 114 C1080 113, 1070 103, 1076 88Z"/>
    <path d="M1095 72 L1096 58"/>
    <path d="M1116 80 L1128 69"/>
    <path d="M1122 103 L1138 106"/>
    <path d="M272 218 C285 201, 295 188, 307 175" opacity=".45"/>
    <path d="M283 221 C298 207, 312 198, 326 190" opacity=".45"/>
  </g>
</svg>
