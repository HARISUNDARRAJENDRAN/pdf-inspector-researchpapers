          cd /tmp/pdf-candidate
          cargo fmt --all
          git diff --check

      - name: Validate candidate
        run: |
          set -euo pipefail
          cd /tmp/pdf-candidate
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

      - name: Build paired binaries and upstream
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/baseline-target" cargo build --release --manifest-path /tmp/pdf-baseline/Cargo.toml --bin research-audit
          CARGO_TARGET_DIR="$RUNNER_TEMP/candidate-target" cargo build --release --manifest-path /tmp/pdf-candidate/Cargo.toml --bin research-audit
          git clone --depth 1 https://github.com/firecrawl/pdf-inspector.git "$RUNNER_TEMP/upstream"
          CARGO_TARGET_DIR="$RUNNER_TEMP/upstream-target" cargo build --release --manifest-path "$RUNNER_TEMP/upstream/Cargo.toml" --bin pdf2md
          echo "BASELINE_BINARY=$RUNNER_TEMP/baseline-target/release/research-audit" >> "$GITHUB_ENV"
          echo "CANDIDATE_BINARY=$RUNNER_TEMP/candidate-target/release/research-audit" >> "$GITHUB_ENV"
          echo "UPSTREAM_BINARY=$RUNNER_TEMP/upstream-target/release/pdf2md" >> "$GITHUB_ENV"

      - name: Download identical 100-paper corpus
        run: |
          set -euo pipefail
          python benchmarks/research_fidelity/audit.py select --arxiv 60 --pmc 40 --out "$RUNNER_TEMP/cleanliness-experiment/manifest.json"
          python benchmarks/research_fidelity/audit.py download --manifest "$RUNNER_TEMP/cleanliness-experiment/manifest.json" --root "$RUNNER_TEMP/cleanliness-experiment/corpus"

      - name: Compare source-grounded fidelity
        run: |
          set -euo pipefail
          python benchmarks/research_fidelity/audit.py evaluate \
            --manifest "$RUNNER_TEMP/cleanliness-experiment/manifest.json" \
            --root "$RUNNER_TEMP/cleanliness-experiment/corpus" \
            --fork-binary "$BASELINE_BINARY" --upstream-binary "$UPSTREAM_BINARY" \
            --out "$RUNNER_TEMP/cleanliness-experiment/baseline.jsonl"
          python benchmarks/research_fidelity/audit.py evaluate \
            --manifest "$RUNNER_TEMP/cleanliness-experiment/manifest.json" \
            --root "$RUNNER_TEMP/cleanliness-experiment/corpus" \
            --fork-binary "$CANDIDATE_BINARY" --upstream-binary "$UPSTREAM_BINARY" \
            --out "$RUNNER_TEMP/cleanliness-experiment/candidate.jsonl"
          python /tmp/compare_candidate.py quality \
            --baseline "$RUNNER_TEMP/cleanliness-experiment/baseline.jsonl" \
            --candidate "$RUNNER_TEMP/cleanliness-experiment/candidate.jsonl" \
            --out "$RUNNER_TEMP/cleanliness-experiment/report/quality.json"

      - name: Compare paired 200-page latency
        run: |
          set -euo pipefail
          python benchmarks/research_fidelity/audit.py stress \
            --manifest "$RUNNER_TEMP/cleanliness-experiment/manifest.json" \
            --root "$RUNNER_TEMP/cleanliness-experiment/corpus" \
            --fork-binary "$CANDIDATE_BINARY" \
            --out-dir "$RUNNER_TEMP/cleanliness-experiment/report" \
            --pages 200 --repeats 1
          python /tmp/compare_candidate.py latency \
            --baseline-binary "$BASELINE_BINARY" --candidate-binary "$CANDIDATE_BINARY" \
            --pdf "$RUNNER_TEMP/cleanliness-experiment/report/research-stress-200p.pdf" \
            --warmups 2 --rounds 12 --max-ratio 1.01 \
            --out "$RUNNER_TEMP/cleanliness-experiment/report/latency.json"
          rm -f "$RUNNER_TEMP/cleanliness-experiment/report/research-stress-200p.pdf"

      - name: Validate WebAssembly
        run: |
          set -euo pipefail
          cd /tmp/pdf-candidate
          cargo check --target wasm32-unknown-unknown
          cargo check --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown
          cargo clippy --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-cleanliness-experiment-${{ github.run_id }}
          path: ${{ runner.temp }}/cleanliness-experiment/report
          if-no-files-found: warn
          retention-days: 30

      - name: Publish validated production files to main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git worktree add --detach /tmp/pdf-release origin/main
          cp /tmp/pdf-candidate/src/markdown/preprocess.rs /tmp/pdf-release/src/markdown/preprocess.rs
          cp /tmp/pdf-candidate/src/markdown/convert.rs /tmp/pdf-release/src/markdown/convert.rs
          cp /tmp/pdf-candidate/src/extractor/mod.rs /tmp/pdf-release/src/extractor/mod.rs
          cd /tmp/pdf-release
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/markdown/preprocess.rs src/markdown/convert.rs src/extractor/mod.rs
          git commit -m 'fix: remove hidden and duplicate research text'
          git push origin HEAD:refs/heads/main
