name: Research paper fast-path benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - opt/research-paper-fastpath
    paths:
      - .github/workflows/research-fast-benchmark-v2.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
      RAYON_NUM_THREADS: "2"
      MALLOC_ARENA_MAX: "2"

    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Prepare isolated baseline and candidate worktrees
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/pdf-inspector-base origin/main
          git worktree add --detach /tmp/pdf-inspector-candidate "$GITHUB_SHA"

      - name: Add paired benchmark drivers
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/pdf-inspector-base/src/bin/research_bench.rs <<'RS'
          use pdf_inspector::process_pdf;
          use std::env;
          use std::time::Instant;

          const FNV_OFFSET: u64 = 0xcbf29ce484222325;
          const FNV_PRIME: u64 = 0x100000001b3;

          fn update_hash(mut hash: u64, bytes: &[u8]) -> u64 {
              for &byte in bytes {
                  hash ^= u64::from(byte);
                  hash = hash.wrapping_mul(FNV_PRIME);
              }
              hash
          }

          fn main() {
              let mut args = env::args().skip(1);
              let _mode = args.next().expect("mode argument");
              let paths: Vec<String> = args.collect();
              assert!(!paths.is_empty(), "at least one PDF path is required");

              let started = Instant::now();
              let mut hash = FNV_OFFSET;
              let mut bytes = 0usize;
              for path in &paths {
                  let result = process_pdf(path)
                      .unwrap_or_else(|error| panic!("failed to parse {path}: {error}"));
                  let markdown = result.markdown.unwrap_or_else(|| {
                      panic!(
                          "{path} produced no markdown (classified {:?})",
                          result.pdf_type
                      )
                  });
                  bytes += markdown.len();
                  hash = update_hash(hash, markdown.as_bytes());
              }

              println!(
                  "{} {} {} {}",
                  started.elapsed().as_nanos(),
                  hash,
                  bytes,
                  paths.len()
              );
          }
          RS

          cat >> /tmp/pdf-inspector-base/Cargo.toml <<'TOML'

          [[bin]]
          name = "research-bench"
          path = "src/bin/research_bench.rs"
          TOML

          cat > /tmp/pdf-inspector-candidate/src/bin/research_bench.rs <<'RS'
          use pdf_inspector::{process_pdf, process_research_pdf};
          use std::env;
          use std::time::Instant;

          const FNV_OFFSET: u64 = 0xcbf29ce484222325;
          const FNV_PRIME: u64 = 0x100000001b3;

          fn update_hash(mut hash: u64, bytes: &[u8]) -> u64 {
              for &byte in bytes {
                  hash ^= u64::from(byte);
                  hash = hash.wrapping_mul(FNV_PRIME);
              }
              hash
          }

          fn main() {
              let mut args = env::args().skip(1);
              let mode = args.next().expect("mode argument");
              let paths: Vec<String> = args.collect();
              assert!(!paths.is_empty(), "at least one PDF path is required");

              let started = Instant::now();
              let mut hash = FNV_OFFSET;
              let mut bytes = 0usize;
              for path in &paths {
                  let result = if mode == "trusted" {
                      process_research_pdf(path)
                  } else {
                      process_pdf(path)
                  }
                  .unwrap_or_else(|error| panic!("failed to parse {path}: {error}"));
                  let markdown = result.markdown.unwrap_or_else(|| {
                      panic!(
                          "{path} produced no markdown (classified {:?})",
                          result.pdf_type
                      )
                  });
                  bytes += markdown.len();
                  hash = update_hash(hash, markdown.as_bytes());
              }

              println!(
                  "{} {} {} {}",
                  started.elapsed().as_nanos(),
                  hash,
                  bytes,
                  paths.len()
              );
          }
          RS

          cat >> /tmp/pdf-inspector-candidate/Cargo.toml <<'TOML'

          [[bin]]
          name = "research-bench"
          path = "src/bin/research_bench.rs"
          TOML

      - name: Download pinned arXiv corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/research-corpus
          download() {
            local id="$1"
            local out="/tmp/research-corpus/${id}.pdf"
            curl --fail --location --retry 4 --retry-delay 2 \
              --user-agent "Learnspace PDF benchmark/1.0" \
              "https://arxiv.org/pdf/${id}" --output "$out" || \
            curl --fail --location --retry 4 --retry-delay 2 \
              --user-agent "Learnspace PDF benchmark/1.0" \
              "https://export.arxiv.org/pdf/${id}" --output "$out"
            test -s "$out"
          }

          download 1706.03762v7
          download 1810.04805v2
          download 2005.14165v4
          download 2010.11929v2
          download 2006.11239v2
          ls -lh /tmp/research-corpus

      - name: Validate and build candidate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pdf-inspector-candidate
          cargo fmt --all -- --check
          cargo clippy -- -D warnings
          cargo test
          CARGO_TARGET_DIR=/tmp/target-candidate cargo build --release --bin research-bench

      - name: Build untouched main baseline
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pdf-inspector-base
          CARGO_TARGET_DIR=/tmp/target-base cargo build --release --bin research-bench

      - name: Run paired benchmark and verify output identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import statistics
          import subprocess
          from pathlib import Path

          papers = sorted(str(path) for path in Path('/tmp/research-corpus').glob('*.pdf'))
          baseline_binary = '/tmp/target-base/release/research-bench'
          candidate_binary = '/tmp/target-candidate/release/research-bench'

          def run(binary: str, mode: str) -> tuple[int, tuple[int, int, int]]:
              completed = subprocess.run(
                  [binary, mode, *papers],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  env=os.environ.copy(),
              )
              if completed.returncode != 0:
                  raise RuntimeError(
                      f'{binary} {mode} failed with exit {completed.returncode}\n'
                      f'stdout:\n{completed.stdout}\n'
                      f'stderr:\n{completed.stderr}'
                  )
              elapsed_ns, digest, byte_count, document_count = completed.stdout.strip().split()
              return int(elapsed_ns), (int(digest), int(byte_count), int(document_count))

          # Warm code paths, allocator state, and filesystem cache. Excluded.
          for _ in range(3):
              run(baseline_binary, 'default')
              run(candidate_binary, 'default')
              run(candidate_binary, 'trusted')

          baseline_samples: list[int] = []
          candidate_default_samples: list[int] = []
          trusted_samples: list[int] = []
          signature = None

          # Rotate process order to reduce frequency, thermal, and ordering bias.
          orders = [
              (
                  (baseline_binary, 'default', baseline_samples),
                  (candidate_binary, 'default', candidate_default_samples),
                  (candidate_binary, 'trusted', trusted_samples),
              ),
              (
                  (candidate_binary, 'trusted', trusted_samples),
                  (baseline_binary, 'default', baseline_samples),
                  (candidate_binary, 'default', candidate_default_samples),
              ),
              (
                  (candidate_binary, 'default', candidate_default_samples),
                  (candidate_binary, 'trusted', trusted_samples),
                  (baseline_binary, 'default', baseline_samples),
              ),
          ]

          for round_index in range(24):
              for binary, mode, bucket in orders[round_index % len(orders)]:
                  elapsed_ns, current_signature = run(binary, mode)
                  if signature is None:
                      signature = current_signature
                  elif current_signature != signature:
                      raise RuntimeError(
                          f'Markdown mismatch: expected {signature}, '
                          f'got {current_signature} for {binary} {mode}'
                      )
                  bucket.append(elapsed_ns)

          median_baseline = statistics.median(baseline_samples)
          median_candidate_default = statistics.median(candidate_default_samples)
          median_trusted = statistics.median(trusted_samples)
          algorithm_gain = (
              median_candidate_default - median_trusted
          ) / median_candidate_default
          total_gain = (median_baseline - median_trusted) / median_baseline

          result = {
              'baseline_sha': os.environ['GITHUB_SHA'],
              'documents': len(papers),
              'rounds': len(trusted_samples),
              'markdown_hash_fnv1a64': signature[0],
              'markdown_bytes': signature[1],
              'baseline_main_median_ms': median_baseline / 1_000_000,
              'candidate_default_median_ms': median_candidate_default / 1_000_000,
              'trusted_fast_path_median_ms': median_trusted / 1_000_000,
              'algorithm_gain_percent': algorithm_gain * 100,
              'total_gain_percent': total_gain * 100,
              'baseline_samples_ms': [value / 1_000_000 for value in baseline_samples],
              'candidate_default_samples_ms': [
                  value / 1_000_000 for value in candidate_default_samples
              ],
              'trusted_samples_ms': [value / 1_000_000 for value in trusted_samples],
          }
          Path('/tmp/benchmark-results.json').write_text(
              json.dumps(result, indent=2) + '\n'
          )

          summary = (
              '## Research-paper parser benchmark\n\n'
              f'- Corpus: {result["documents"]} pinned arXiv PDFs\n'
              f'- Alternating measured rounds: {result["rounds"]}\n'
              f'- Unmodified `main`: **{result["baseline_main_median_ms"]:.3f} ms**\n'
              f'- Candidate default path: **{result["candidate_default_median_ms"]:.3f} ms**\n'
              f'- Committed research-paper fast path: **{result["trusted_fast_path_median_ms"]:.3f} ms**\n'
              f'- Core algorithm improvement: **{result["algorithm_gain_percent"]:.2f}%**\n'
              f'- Improvement over current `main`: **{result["total_gain_percent"]:.2f}%**\n'
              f'- Output: byte-identical, FNV-1a `{result["markdown_hash_fnv1a64"]}` '
              f'over {result["markdown_bytes"]:,} Markdown bytes\n'
          )
          print(summary)
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(summary)

          if algorithm_gain <= 0.005:
              raise RuntimeError(
                  'Committed fast path did not beat candidate default by 0.5%: '
                  f'{algorithm_gain * 100:.3f}%'
              )
          if total_gain <= 0.005:
              raise RuntimeError(
                  'Committed fast path did not beat untouched main by 0.5%: '
                  f'{total_gain * 100:.3f}%'
              )
          PY

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-paper-fast-path-results
          path: /tmp/benchmark-results.json
          if-no-files-found: warn
