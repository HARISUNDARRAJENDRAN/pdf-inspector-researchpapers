          stats_anchor = '    // Calculate font statistics\n    let font_stats = calculate_font_stats(&lines);\n'
          stats_replacement = '''    // Exact same-coordinate overprints are a rendering technique, not\n    // duplicate semantic content. Remove them before they can skew font\n    // statistics or reach Markdown.\n    let lines = remove_exact_duplicate_overlays(lines);\n\n    // Calculate font statistics\n    let font_stats = calculate_font_stats(&lines);\n'''
          if source.count(stats_anchor) != 2:
              raise SystemExit(f'expected two font-stat anchors, found {source.count(stats_anchor)}')
          source = source.replace(stats_anchor, stats_replacement)
          convert.write_text(source)

          extractor = Path('/tmp/pdf-candidate/src/extractor/mod.rs')
          source = extractor.read_text()
          old = '''                let coherent =\n                    off.len() >= 10 && wordy_chars * 2 >= total_chars.max(1) && !straddles;\n'''
          new = '''                let dense_neighbor_page =\n                    off.len() >= 10 && wordy_chars * 2 >= total_chars.max(1);\n                // A hidden publisher phrase can be one complete Tj/TJ item,\n                // so item count alone is not a safe coherence test. Require a\n                // substantial, word-like, alphabetic phrase before clipping\n                // sparse off-page material; isolated math glyphs remain.\n                let sparse_words: usize = off\n                    .iter()\n                    .map(|item| {\n                        item.text\n                            .split_whitespace()\n                            .filter(|word| word.chars().any(char::is_alphabetic))\n                            .count()\n                    })\n                    .sum();\n                let alphabetic_chars: usize = off\n                    .iter()\n                    .map(|item| item.text.chars().filter(|c| c.is_alphabetic()).count())\n                    .sum();\n                let sparse_hidden_phrase = (1..=4).contains(&off.len())\n                    && total_chars >= 24\n                    && sparse_words >= 4\n                    && alphabetic_chars * 2 >= total_chars.max(1);\n                let coherent =\n                    (dense_neighbor_page || sparse_hidden_phrase) && !straddles;\n'''
