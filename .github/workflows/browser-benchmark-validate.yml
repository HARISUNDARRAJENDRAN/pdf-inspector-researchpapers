name: Validate browser research benchmark

on:
  push:
    branches: [feat/browser-research-benchmark]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Root tests
        run: cargo test --verbose

      - name: Check WASM bindings
        run: cargo check --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown

      - name: Clippy WASM bindings
        run: cargo clippy --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Run WASM tests
        run: wasm-pack test --node --release wasm

      - name: Build browser WASM
        run: wasm-pack build wasm --target web --out-dir pkg --release

      - name: Verify browser benchmark contract
        run: |
          test -s site/benchmark.html
          grep -q 'processResearchPdf' wasm/pkg/pdf_inspector_wasm.js
          grep -q 'processResearchPdf' wasm/pkg/pdf_inspector_wasm.d.ts
          grep -q './wasm/pdf_inspector_wasm.js' site/benchmark.html
          if grep -q 'cdn.jsdelivr.net/npm/@firecrawl/pdf-inspector-wasm' site/benchmark.html; then
            echo 'Benchmark must use this fork local WASM build' >&2
            exit 1
          fi
