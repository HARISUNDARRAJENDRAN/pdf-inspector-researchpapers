name: Academic section heading experiment

on:
  workflow_dispatch:
  push:
    branches: [opt/research-section-headings]
    paths: ['.github/workflows/research-section-heading-experiment.yml']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RAYON_NUM_THREADS: '2'
  MALLOC_ARENA_MAX: '2'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmarks/research_fidelity/requirements.txt

      - name: Install audit dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc time
          python -m pip install --upgrade pip
          python -m pip install -r benchmarks/research_fidelity/requirements.txt

      - name: Prepare baseline and candidate worktrees
        run: |
          set -euo pipefail
          git fetch origin main lab/research-fidelity-audit
          BASE_SHA=$(git rev-parse origin/main)
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git worktree add --detach /tmp/pdf-baseline "$BASE_SHA"
          git worktree add --detach /tmp/pdf-candidate "$BASE_SHA"
          git show origin/lab/research-fidelity-audit:benchmarks/research_fidelity/compare_candidate.py > /tmp/compare_candidate.py
          mkdir -p "$RUNNER_TEMP/heading-experiment/report"

      - name: Add conservative bare-number research heading support
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/pdf-candidate/src/markdown/heading.rs')
          source = path.read_text()
          old = r'''fn parse_numbering(text: &str) -> Option<(NumberingKind, usize, Vec<u32>)> {
    let first = text.split_whitespace().next()?;
    let has_delimiter = first.ends_with(['.', ')', ':']);
    if !has_delimiter {
        return None;
    }
    let token = first.trim_end_matches(['.', ')', ':']);
    if token.is_empty() {
        return None;
    }

    let decimal: Option<Vec<u32>> = token
'''
          new = r'''fn parse_numbering(text: &str) -> Option<(NumberingKind, usize, Vec<u32>)> {
    let mut words = text.split_whitespace();
    let first = words.next()?;
    let has_delimiter = first.ends_with(['.', ')', ':']);
    let token = first.trim_end_matches(['.', ')', ':']);
    if token.is_empty() {
        return None;
    }

    // IEEE, ACM, Elsevier, and many TeX templates emit section headings as
    // `1 Introduction` rather than `1. Introduction`. Accept that grammar only
    // when the first title word begins uppercase and the section number is
    // realistically small. A candidate still needs repeated visual/sequence
    // evidence below, so a lone numbered body sentence cannot become a heading.
    let bare_decimal_heading = if has_delimiter {
        false
    } else {
        let first_title_word = words.next()?;
        let starts_uppercase = first_title_word
            .chars()
            .find(|character| character.is_alphabetic())
            .is_some_and(char::is_uppercase);
        let simple_decimal = token.len() <= 2
            && token.chars().all(|character| character.is_ascii_digit())
            && token.parse::<u32>().ok().is_some_and(|value| value <= 50);
        simple_decimal && starts_uppercase
    };
    if !has_delimiter && !bare_decimal_heading {
        return None;
    }

    let decimal: Option<Vec<u32>> = token
'''
          if source.count(old) != 1:
              raise SystemExit('parse_numbering anchor changed')
          source = source.replace(old, new, 1)

          tests_anchor = '    #[test]\n    fn coherent_numbered_hierarchy_is_promoted() {\n'
          tests = r'''    #[test]
    fn bare_top_level_academic_sections_form_numbered_candidates() {
        assert_eq!(
            parse_numbering("1 Introduction"),
            Some((NumberingKind::Decimal, 1, vec![1]))
        );
        assert_eq!(
            parse_numbering("12 Experimental Results"),
            Some((NumberingKind::Decimal, 1, vec![12]))
        );
        assert_eq!(parse_numbering("2024 Results"), None);
        assert_eq!(parse_numbering("1 introduction"), None);
        assert_eq!(parse_numbering("3 apples were measured"), None);
    }

    #[test]
    fn bare_academic_section_sequence_is_promoted() {
        let lines = vec![
            line("1 Introduction", 700.0, 72.0, 12.0, "Section", true),
            line("body prose", 680.0, 72.0, 10.0, "Body", false),
            line("body prose continues", 660.0, 72.0, 10.0, "Body", false),
            line("2 Methods", 500.0, 72.0, 12.0, "Section", true),
            line("body prose", 480.0, 72.0, 10.0, "Body", false),
            line("body prose continues", 460.0, 72.0, 10.0, "Body", false),
            line("3 Results", 300.0, 72.0, 12.0, "Section", true),
        ];
        let decisions = classify_heading_sequences(
            &lines,
            10.0,
            &[12.0],
            &HashSet::from([0usize, 3usize, 6usize]),
            &HashSet::new(),
        );
        assert!(decisions.contains_key(&0));
        assert!(decisions.contains_key(&3));
        assert!(decisions.contains_key(&6));
    }

'''
          if source.count(tests_anchor) != 1:
              raise SystemExit('heading test anchor changed')
          source = source.replace(tests_anchor, tests + tests_anchor, 1)
          path.write_text(source)
          PY
          cd /tmp/pdf-candidate
          cargo fmt --all
          git diff --check

      - name: Validate candidate source and tests
        run: |
          set -euo pipefail
          cd /tmp/pdf-candidate
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

      - name: Build baseline, candidate, and upstream
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/baseline-target" cargo build --release --manifest-path /tmp/pdf-baseline/Cargo.toml --bin research-audit
          CARGO_TARGET_DIR="$RUNNER_TEMP/candidate-target" cargo build --release --manifest-path /tmp/pdf-candidate/Cargo.toml --bin research-audit
          git clone --depth 1 https://github.com/firecrawl/pdf-inspector.git "$RUNNER_TEMP/upstream"
          CARGO_TARGET_DIR="$RUNNER_TEMP/upstream-target" cargo build --release --manifest-path "$RUNNER_TEMP/upstream/Cargo.toml" --bin pdf2md
          echo "BASELINE_BINARY=$RUNNER_TEMP/baseline-target/release/research-audit" >> "$GITHUB_ENV"
          echo "CANDIDATE_BINARY=$RUNNER_TEMP/candidate-target/release/research-audit" >> "$GITHUB_ENV"
          echo "UPSTREAM_BINARY=$RUNNER_TEMP/upstream-target/release/pdf2md" >> "$GITHUB_ENV"

      - name: Download one identical 100-paper corpus
        run: |
          set -euo pipefail
          python benchmarks/research_fidelity/audit.py select --arxiv 60 --pmc 40 --out "$RUNNER_TEMP/heading-experiment/manifest.json"
          python benchmarks/research_fidelity/audit.py download --manifest "$RUNNER_TEMP/heading-experiment/manifest.json" --root "$RUNNER_TEMP/heading-experiment/corpus"

      - name: Compare source-grounded heading fidelity
        run: |
          set -euo pipefail
          python benchmarks/research_fidelity/audit.py evaluate \
            --manifest "$RUNNER_TEMP/heading-experiment/manifest.json" \
            --root "$RUNNER_TEMP/heading-experiment/corpus" \
            --fork-binary "$BASELINE_BINARY" --upstream-binary "$UPSTREAM_BINARY" \
            --out "$RUNNER_TEMP/heading-experiment/baseline.jsonl"
          python benchmarks/research_fidelity/audit.py evaluate \
            --manifest "$RUNNER_TEMP/heading-experiment/manifest.json" \
            --root "$RUNNER_TEMP/heading-experiment/corpus" \
            --fork-binary "$CANDIDATE_BINARY" --upstream-binary "$UPSTREAM_BINARY" \
            --out "$RUNNER_TEMP/heading-experiment/candidate.jsonl"
          python /tmp/compare_candidate.py quality \
            --baseline "$RUNNER_TEMP/heading-experiment/baseline.jsonl" \
            --candidate "$RUNNER_TEMP/heading-experiment/candidate.jsonl" \
            --out "$RUNNER_TEMP/heading-experiment/report/quality.json"

      - name: Compare paired 200-page latency
        run: |
          set -euo pipefail
          python benchmarks/research_fidelity/audit.py stress \
            --manifest "$RUNNER_TEMP/heading-experiment/manifest.json" \
            --root "$RUNNER_TEMP/heading-experiment/corpus" \
            --fork-binary "$CANDIDATE_BINARY" \
            --out-dir "$RUNNER_TEMP/heading-experiment/report" --pages 200 --repeats 1
          python /tmp/compare_candidate.py latency \
            --baseline-binary "$BASELINE_BINARY" --candidate-binary "$CANDIDATE_BINARY" \
            --pdf "$RUNNER_TEMP/heading-experiment/report/research-stress-200p.pdf" \
            --warmups 2 --rounds 12 --max-ratio 1.01 \
            --out "$RUNNER_TEMP/heading-experiment/report/latency.json"
          rm -f "$RUNNER_TEMP/heading-experiment/report/research-stress-200p.pdf"

      - name: Validate candidate WebAssembly
        run: |
          set -euo pipefail
          cd /tmp/pdf-candidate
          cargo check --target wasm32-unknown-unknown
          cargo check --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown
          cargo clippy --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings

      - name: Build versioned validation evidence
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'heading-experiment' / 'report'
          record = {
              'change': 'bare-number academic section headings',
              'baseline_sha': os.environ['BASE_SHA'],
              'candidate_branch_sha': os.environ['GITHUB_SHA'],
              'quality': json.loads((root / 'quality.json').read_text()),
              'latency': json.loads((root / 'latency.json').read_text()),
          }
          (root / 'validated.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-heading-experiment-${{ github.run_id }}
          path: ${{ runner.temp }}/heading-experiment/report
          if-no-files-found: warn
          retention-days: 30

      - name: Publish validated parser and evidence to main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git worktree add --detach /tmp/pdf-release origin/main
          cp /tmp/pdf-candidate/src/markdown/heading.rs /tmp/pdf-release/src/markdown/heading.rs
          mkdir -p /tmp/pdf-release/benchmarks/research_fidelity/validated
          cp "$RUNNER_TEMP/heading-experiment/report/validated.json" \
             /tmp/pdf-release/benchmarks/research_fidelity/validated/bare-section-heading-fidelity.json
          cd /tmp/pdf-release
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/markdown/heading.rs benchmarks/research_fidelity/validated/bare-section-heading-fidelity.json
          git commit -m 'fix: recognize bare-number academic section headings'
          git push origin HEAD:refs/heads/main
