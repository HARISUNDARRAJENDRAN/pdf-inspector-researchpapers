name: Apply research-paper fast path

on:
  push:
    branches:
      - opt/research-paper-fastpath
    paths:
      - .github/workflows/apply-research-paper-fastpath.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: opt/research-paper-fastpath
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Apply source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_research_fastpath.py
          python3 scripts/fix_research_fastpath_tests.py

      - name: Validate native, Python, and WASM builds
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -- -D warnings
          cargo test --verbose
          cargo check --features python
          cargo build --release --verbose
          cargo check --target wasm32-unknown-unknown
          cargo check --manifest-path wasm/Cargo.toml --target wasm32-unknown-unknown
          git diff --check

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/detector.rs src/lib.rs src/python.rs pdf_inspector.pyi docs/rust-api.md tests/research_paper_fast_path.rs
          git diff --cached --stat
          git diff --cached --check
          git commit -m "perf: add trusted research-paper fast path"
          git push origin HEAD:opt/research-paper-fastpath
