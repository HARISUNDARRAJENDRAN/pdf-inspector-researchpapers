name: Promote validated cross-page paragraphs

on:
  push:
    branches: [lab/research-fidelity-audit]
    paths:
      - 'src/markdown/convert.rs'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RAYON_NUM_THREADS: '2'
  MALLOC_ARENA_MAX: '2'

concurrency:
  group: promote-cross-page-paragraph
  cancel-in-progress: true

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmarks/research_fidelity/requirements.txt

      - name: Wait for the preceding caption release
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            git fetch origin main
            if git show origin/main:src/markdown/preprocess.rs | grep -q 'merge_wrapped_caption_lines'; then
              echo 'caption fidelity release is present on main'
              exit 0
            fi
            echo "waiting for caption promotion ($attempt/90)"
            sleep 60
          done
          echo 'caption fidelity release did not reach main' >&2
          exit 1

      - name: Install audit dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc
          python -m pip install --upgrade pip
          python -m pip install -r benchmarks/research_fidelity/requirements.txt

      - name: Prepare baseline and candidate worktrees
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach /tmp/page-main origin/main
          git worktree add --detach /tmp/page-candidate "$GITHUB_SHA"
          cd /tmp/page-candidate
          cargo fmt --all -- --check
          cargo clippy -- -D warnings
          cargo test

      - name: Build both parsers
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=/tmp/page-target-main cargo build --release --manifest-path /tmp/page-main/Cargo.toml --bin research-audit --bin pdf2md
          CARGO_TARGET_DIR=/tmp/page-target-candidate cargo build --release --manifest-path /tmp/page-candidate/Cargo.toml --bin research-audit --bin pdf2md

      - name: Download one shared source-grounded corpus
        run: |
          set -euo pipefail
          mkdir -p /tmp/page-corpus
          python /tmp/page-candidate/benchmarks/research_fidelity/audit.py select --arxiv 60 --pmc 40 --out /tmp/page-manifest.json
          python /tmp/page-candidate/benchmarks/research_fidelity/audit.py download --manifest /tmp/page-manifest.json --root /tmp/page-corpus

      - name: Evaluate current main
        run: |
          python /tmp/page-candidate/benchmarks/research_fidelity/audit.py evaluate \
            --manifest /tmp/page-manifest.json --root /tmp/page-corpus \
            --fork-binary /tmp/page-target-main/release/research-audit \
            --upstream-binary /tmp/page-target-main/release/pdf2md \
            --out /tmp/page-main-results.jsonl

      - name: Evaluate candidate
        run: |
          python /tmp/page-candidate/benchmarks/research_fidelity/audit.py evaluate \
            --manifest /tmp/page-manifest.json --root /tmp/page-corpus \
            --fork-binary /tmp/page-target-candidate/release/research-audit \
            --upstream-binary /tmp/page-target-candidate/release/pdf2md \
            --out /tmp/page-candidate-results.jsonl

      - name: Gate paragraph fidelity and all protected metrics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, statistics
          from pathlib import Path

          names = (
              'overall_score', 'word_f1', 'bigram_f1', 'sequence_similarity',
              'paragraph_precision', 'paragraph_recall', 'paragraph_f1',
              'heading_f1', 'caption_f1', 'table_score', 'equation_score',
              'tail_recall', 'cleanliness',
          )

          def walk(value, path=()):
              if isinstance(value, dict):
                  metrics = value.get('metrics') if isinstance(value.get('metrics'), dict) else value
                  if isinstance(metrics, dict) and isinstance(metrics.get('overall_score'), (int, float)):
                      label = '/'.join(map(str, path))
                      for key in ('implementation', 'name', 'mode', 'variant', 'parser'):
                          if value.get(key) is not None:
                              label += '/' + str(value[key])
                      yield label.casefold(), metrics
                  for key, child in value.items():
                      yield from walk(child, (*path, key))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      yield from walk(child, (*path, index))

          def aggregate(path):
              rows = []
              for raw in Path(path).read_text().splitlines():
                  if not raw.strip():
                      continue
                  candidates = [(label, metrics) for label, metrics in walk(json.loads(raw)) if 'research' in label and 'upstream' not in label]
                  if not candidates:
                      continue
                  candidates.sort(key=lambda pair: ('fast' in pair[0], -len(pair[0])), reverse=True)
                  metrics = candidates[0][1]
                  if all(isinstance(metrics.get(name), (int, float)) and math.isfinite(float(metrics[name])) for name in names):
                      rows.append(metrics)
              if len(rows) < 90:
                  raise RuntimeError(f'only {len(rows)} valid rows in {path}')
              return {name: statistics.fmean(float(row[name]) for row in rows) for name in names}, len(rows)

          main, main_count = aggregate('/tmp/page-main-results.jsonl')
          candidate, candidate_count = aggregate('/tmp/page-candidate-results.jsonl')
          for name in names:
              print(f'{name}: main={main[name]:.8f} candidate={candidate[name]:.8f} delta={candidate[name]-main[name]:+.8f}')

          if candidate['overall_score'] < main['overall_score'] + 0.00005:
              raise RuntimeError('overall fidelity did not improve')
          if candidate['paragraph_f1'] < main['paragraph_f1'] + 0.00020:
              raise RuntimeError('paragraph F1 did not materially improve')
          if candidate['paragraph_precision'] + 0.00010 < main['paragraph_precision']:
              raise RuntimeError('paragraph precision regressed')

          for name in (
              'word_f1', 'bigram_f1', 'sequence_similarity', 'heading_f1',
              'caption_f1', 'table_score', 'equation_score', 'tail_recall', 'cleanliness',
          ):
              if candidate[name] + 0.00075 < main[name]:
                  raise RuntimeError(f'protected metric regressed: {name}')

          Path('/tmp/page-fidelity-gate.json').write_text(json.dumps({
              'papers': min(main_count, candidate_count),
              'main': main,
              'candidate': candidate,
              'delta': {name: candidate[name] - main[name] for name in names},
          }, indent=2) + '\n')
          PY

      - name: Add identical whole-corpus latency drivers
        run: |
          set -euo pipefail
          for dir in /tmp/page-main /tmp/page-candidate; do
            cat > "$dir/src/bin/page_latency.rs" <<'RS'
          use pdf_inspector::process_research_pdf;
          use std::env;
          use std::time::Instant;
          fn main() {
              let papers: Vec<String> = env::args().skip(1).collect();
              assert!(!papers.is_empty());
              let start = Instant::now();
              let mut bytes = 0usize;
              for paper in papers {
                  bytes += process_research_pdf(&paper)
                      .expect("parse")
                      .markdown
                      .expect("markdown")
                      .len();
              }
              println!("{} {}", start.elapsed().as_nanos(), bytes);
          }
          RS
            cat >> "$dir/Cargo.toml" <<'TOML'

          [[bin]]
          name = "page-latency"
          path = "src/bin/page_latency.rs"
          TOML
          done
          CARGO_TARGET_DIR=/tmp/page-latency-main cargo build --release --manifest-path /tmp/page-main/Cargo.toml --bin page-latency
          CARGO_TARGET_DIR=/tmp/page-latency-candidate cargo build --release --manifest-path /tmp/page-candidate/Cargo.toml --bin page-latency

      - name: Gate paired latency
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, statistics, subprocess
          from pathlib import Path
          manifest = json.loads(Path('/tmp/page-manifest.json').read_text())
          root = Path('/tmp/page-corpus')
          papers = []
          for item in manifest['papers']:
              if item.get('download_status') == 'ok' and item.get('provider') == 'arxiv':
                  path = root / item['pdf_path']
                  if path.exists(): papers.append(str(path))
              if len(papers) == 5: break
          if len(papers) != 5: raise RuntimeError('five latency papers unavailable')
          bins = {'main':'/tmp/page-latency-main/release/page-latency','candidate':'/tmp/page-latency-candidate/release/page-latency'}
          def run(label):
              out = subprocess.check_output([bins[label], *papers], text=True, env=os.environ).split()
              if int(out[1]) <= 0: raise RuntimeError('empty output')
              return int(out[0])
          for _ in range(3): run('main'); run('candidate')
          samples = {'main':[], 'candidate':[]}
          for index in range(24):
              for label in (('main','candidate') if index % 2 == 0 else ('candidate','main')):
                  samples[label].append(run(label))
          main_median = statistics.median(samples['main'])
          candidate_median = statistics.median(samples['candidate'])
          delta = (candidate_median-main_median)/main_median
          print(f'median main={main_median/1e6:.3f}ms candidate={candidate_median/1e6:.3f}ms delta={delta*100:+.3f}%')
          if candidate_median > main_median * 1.01:
              raise RuntimeError('median latency regressed by more than 1%')
          Path('/tmp/page-latency-gate.json').write_text(json.dumps({
              'main_median_ms': main_median/1e6,
              'candidate_median_ms': candidate_median/1e6,
              'delta_percent': delta*100,
              'samples_ms': {key:[value/1e6 for value in values] for key, values in samples.items()},
          }, indent=2) + '\n')
          PY

      - name: Push one clean production commit
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add -b release/cross-page-paragraph /tmp/page-release origin/main
          cp /tmp/page-candidate/src/markdown/convert.rs /tmp/page-release/src/markdown/convert.rs
          cd /tmp/page-release
          cargo fmt --all -- --check
          cargo clippy -- -D warnings
          cargo test
          test "$(git diff --name-only)" = 'src/markdown/convert.rs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/markdown/convert.rs
          git commit -m 'fix: preserve prose across physical page boundaries'
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/page-promoted-sha.txt

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-page-paragraph-promotion-${{ github.run_id }}
          path: |
            /tmp/page-fidelity-gate.json
            /tmp/page-latency-gate.json
            /tmp/page-promoted-sha.txt
          if-no-files-found: warn
          retention-days: 30
